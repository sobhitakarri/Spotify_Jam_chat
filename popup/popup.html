<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Jam Chat Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1DB954" stroke-width="2.5">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <h2>Spotify Jam Chat</h2>
    </div>
    <span class="badge" id="statusBadge">Active</span>
  </div>

  <div class="content">
    <div class="form-group">
      <label for="nickname">Your Nickname</label>
      <input type="text" id="nickname" placeholder="e.g. DJ_VibeMaster">
    </div>

    <div class="form-group">
      <label for="serverUrl">Real-Time Server URL</label>
      <input type="text" id="serverUrl" placeholder="http://localhost:3000">
    </div>

    <div class="toggle-group">
      <span>Sound Notifications</span>
      <label class="switch">
        <input type="checkbox" id="soundToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="jam-info-card">
      <div class="card-title">🎵 Active Jam Session</div>
      <div class="card-status" id="jamStatus">Detecting Jam on open.spotify.com...</div>
      <div class="jam-manual-join" style="margin-top: 8px; display: flex; gap: 6px;">
        <input type="text" id="manualJamInput" placeholder="Paste Jam link or room code..." style="flex: 1; font-size: 11px; padding: 6px;">
        <button id="joinJamBtn" class="btn-primary" style="font-size: 11px; padding: 6px 12px; border-radius: 6px;">Join Chat</button>
      </div>
    </div>

    <button id="saveBtn" class="btn-primary">Save Settings</button>
  </div>

  <div class="footer">
    Works on Opera, Chrome & Brave 🚀
  </div>

  <script src="popup.js"></script>
</body>
</html>
