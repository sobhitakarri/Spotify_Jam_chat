<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Jam Chat Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1DB954" stroke-width="2.5">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <h2>Spotify Jam Chat</h2>
    </div>
    <span class="badge" id="statusBadge">Cloud Active</span>
  </div>

  <div class="content">
    <div class="info-row">
      <span class="info-label">Spotify User</span>
      <span class="info-value" id="userDisplayName">Detecting profile...</span>
    </div>

    <div class="form-group">
      <label for="serverUrl">Cloud Relay Server URL</label>
      <input type="text" id="serverUrl" placeholder="https://spotify-jam-chat-2ude.onrender.com">
    </div>

    <div class="jam-info-card">
      <div class="card-title">🎵 Active Jam Session</div>
      <div class="card-status" id="jamStatus">Detecting Jam on open.spotify.com...</div>
      <div class="presence-status" id="presenceStatus">⏳ Waiting for Jam partner...</div>
    </div>

    <button id="saveBtn" class="btn-primary">Save Server Settings</button>
  </div>

  <div class="footer">
    Works on Opera, Chrome & Brave 🚀
  </div>

  <script src="popup.js"></script>
</body>
</html>
